server:
  port: 8080
  proxied: true # 在 Caddy 反向代理後面

theme:
  # 跟原本 Homepage 用的 slate 深色 + sky 強調色一致
  light: false
  disable-picker: true
  background-color: 222 47 11
  primary-color: 199 89 48
  positive-color: 142 71 45
  negative-color: 0 84 60

pages:
  - name: Home
    slug: home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: America/Los_Angeles
                label: SF
              - timezone: Asia/Taipei
                label: 新竹

          - type: markets
            markets:
              - symbol: TWD=X
                name: USD/TWD
              - symbol: TWDJPY=X
                # Yahoo 的 cross-pair 慣例（AAABBB=X = 1 AAA 換多少 BBB）；
                # 部署後確認數字合理（1 TWD 換 4~5 日圓左右）。
                name: TWD/JPY

          - type: to-do
            id: main

      - size: full
        widgets:
          - type: monitor
            title: 服務健康
            cache: 1m
            sites:
              - title: VPS Dashboard
                url: https://dashboard.garyhsieh-proj.com
                icon: mdi:view-dashboard
              - title: Quick Portal
                url: https://portal.garyhsieh-proj.com
                icon: mdi:send
              - title: DevHub
                url: https://devhub.garyhsieh-proj.com
                icon: mdi:code-braces
              - title: 繪本庫
                url: https://library.garyhsieh-proj.com
                icon: mdi:book-open-page-variant
              - title: 定期通知
                url: https://routine.garyhsieh-proj.com
                icon: mdi:bell-ring
                # 該站自己有 basic_auth，沒帶帳密會回 401；先用 alt-status-codes
                # 把 401 視為「有回應、算正常」。想要精確驗證可改成 basic-auth 帶真帳密。
                alt-status-codes:
                  - 401
              - title: ntfy
                url: https://notify.garyhsieh-proj.com
                icon: mdi:message-badge
              - title: Supabase
                url: https://supabase.garyhsieh-proj.com
                icon: si:supabase
                # kong 要求 apikey，沒帶會回 401；同上用 alt-status-codes 視為正常。
                alt-status-codes:
                  - 401
              - title: mangan-log
                url: https://mangan-log.garyhsieh-proj.com
                icon: mdi:heart-pulse

          - type: hacker-news
            limit: 8
            sort-by: top
            collapse-after: 5

      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: 後台管理
                links:
                  - title: Cloudflare
                    url: https://dash.cloudflare.com
                    icon: si:cloudflare
                  - title: DuckDNS
                    url: https://www.duckdns.org
              - title: 程式碼
                links:
                  - title: service-home
                    url: https://github.com/garykh2008/service-home
                    icon: si:github
              - title: 文件
                links:
                  - title: Glance Docs
                    url: https://github.com/glanceapp/glance
                  - title: Caddy Docs
                    url: https://caddyserver.com/docs/

          - type: rss
            title: 中央社科技
            limit: 6
            single-line-titles: true # 標題截斷成一行＋省略號，跟 Homepage 舊版一樣，避免長標題亂折行
            feeds:
              - url: https://feeds.feedburner.com/rsscna/technology
                title: 中央社科技

          - type: rss
            title: The Verge
            limit: 6
            single-line-titles: true
            feeds:
              - url: https://www.theverge.com/rss/index.xml
                title: The Verge

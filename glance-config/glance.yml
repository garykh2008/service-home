server:
  port: 8080
  proxied: true # 在 Caddy 反向代理後面

theme:
  # 跟原本 Homepage 用的 slate 深色 + sky 強調色一致
  light: false
  disable-picker: true
  background-color: 222 47 11
  primary-color: 199 89 48
  positive-color: 142 71 45
  negative-color: 0 84 60

pages:
  - name: Home
    slug: home
    columns:
      - size: small
        widgets:
          - type: search
            search-engine: duckduckgo
            new-tab: false
            autofocus: false
            placeholder: "搜尋…（! 開頭可用 DDG bangs，如 !yt、!g）"

          - type: clock
            hour-format: 24h
            timezones:
              - timezone: America/Los_Angeles
                label: SF
              - timezone: Asia/Taipei
                label: 新竹

          - type: weather
            # 固定地點（Glance 是伺服器端渲染，不像舊 custom.js 會跟著你當下位置跑）；
            # 先設家（新竹）。想再加你目前所在地也可以，跟我說地點就加一個。
            location: Hsinchu, Taiwan
            units: metric
            hour-format: 24h

      - size: small
        widgets:
          - type: markets
            markets:
              - symbol: TWD=X
                name: USD/TWD
              - symbol: TWDJPY=X
                # Yahoo 的 cross-pair 慣例（AAABBB=X = 1 AAA 換多少 BBB）；
                # 部署後確認數字合理（1 TWD 換 4~5 日圓左右）。
                name: TWD/JPY

          - type: to-do
            id: main

      - size: full
        widgets:
          - type: monitor
            title: 服務健康
            cache: 1m
            sites:
              - title: VPS Dashboard
                url: https://dashboard.garyhsieh-proj.com
                icon: mdi:view-dashboard
              - title: Quick Portal
                url: https://portal.garyhsieh-proj.com
                icon: mdi:send
              - title: DevHub
                url: https://devhub.garyhsieh-proj.com
                icon: mdi:code-braces
              - title: 繪本庫
                url: https://library.garyhsieh-proj.com
                icon: mdi:book-open-page-variant
              - title: 定期通知
                url: https://routine.garyhsieh-proj.com
                icon: mdi:bell-ring
                # 該站自己有 basic_auth，沒帶帳密會回 401；先用 alt-status-codes
                # 把 401 視為「有回應、算正常」。想要精確驗證可改成 basic-auth 帶真帳密。
                alt-status-codes:
                  - 401
              - title: ntfy
                url: https://notify.garyhsieh-proj.com
                icon: di:ntfy
              - title: Supabase
                url: https://supabase.garyhsieh-proj.com
                icon: si:supabase
                # kong 要求 apikey，沒帶會回 401；同上用 alt-status-codes 視為正常。
                alt-status-codes:
                  - 401
              - title: mangan-log
                url: https://mangan-log.garyhsieh-proj.com
                icon: mdi:heart-pulse

          - type: server-stats
            # 容器共用 host 的核心，CPU/記憶體應該準；磁碟用量可能只反映容器自己的
            # 檔案系統（不是 host 真實磁碟），部署後看數字對不對再說，不對就拿掉/不理磁碟那欄。
            servers:
              - type: local
                name: VPS

          - type: bookmarks
            groups:
              - title: 後台管理
                links:
                  - title: Cloudflare
                    url: https://dash.cloudflare.com
                    icon: si:cloudflare
                  - title: DuckDNS
                    url: https://www.duckdns.org
                    icon: di:duckdns
              - title: 程式碼
                links:
                  - title: service-home
                    url: https://github.com/garykh2008/service-home
                    icon: si:github
              - title: 文件
                links:
                  - title: Glance Docs
                    url: https://github.com/glanceapp/glance
                  - title: Caddy Docs
                    url: https://caddyserver.com/docs/
                    icon: si:caddy

  - name: News
    slug: news
    columns:
      - size: full
        widgets:
          - type: hacker-news
            limit: 10
            sort-by: top
            collapse-after: 8

      - size: small
        widgets:
          - type: rss
            title: 中央社科技
            limit: 8
            single-line-titles: true
            feeds:
              - url: https://feeds.feedburner.com/rsscna/technology
                title: 中央社科技

      - size: small
        widgets:
          - type: rss
            title: The Verge
            limit: 8
            single-line-titles: true
            feeds:
              - url: https://www.theverge.com/rss/index.xml
                title: The Verge

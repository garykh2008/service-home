services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      # 只綁 localhost，對外一律走 Caddy 反向代理
      - 127.0.0.1:3050:3000
    volumes:
      - ./homepage-config:/app/config
      # 唯讀掛載 docker.sock，僅用於顯示容器狀態摘要（不做深度操作）
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Homepage 從反向代理後面被存取，需允許來源網域
      HOMEPAGE_ALLOWED_HOSTS: home.garyhsieh-proj.com
    restart: unless-stopped

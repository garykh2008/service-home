---
# 頁首資訊小工具
# 文件：https://gethomepage.dev/configs/info-widgets/

- greeting:
    text_size: xl
    text: 哈囉，Gary 👋

- datetime:
    text_size: l
    format:
      dateStyle: full
      timeStyle: short
      hourCycle: h23

# 天氣：openmeteo 免 API key。
# 不指定座標 → 用瀏覽器定位，天氣跟著你當下所在地，與頁首主時鐘一致。
# （HTTPS 下首次會請求定位權限；若拒絕則不顯示天氣。想固定某地就填回
#  latitude / longitude / label。）
- openmeteo:
    units: metric
    cache: 5

# VPS 資源一瞥（cpu/記憶體/開機時間讀自主機）。
# 邊界：只做「一眼掃過」，深入監控仍走 VPS Dashboard。
- resources:
    label: VPS
    cpu: true
    memory: true
    uptime: true

---
# 服務卡片
# 文件：https://gethomepage.dev/configs/services/
#
# 每張卡片：
#   href        點擊前往的網址（正式網域）
#   siteMonitor 健康檢查目標（外部 HTTP 探測），決定燈號
#   server/container  docker.sock 容器狀態摘要（上/下線 + CPU/記憶體）
#   showStats   顯示 CPU/記憶體用量
#   icon        取自 https://github.com/homarr-labs/dashboard-icons
#
# ⚠️ container 名稱為推測值，請在 VPS 上跑 `docker ps --format '{{.Names}}'`
#    核對後修正。名稱對不上時只是不顯示狀態，不會報錯。
#    非容器（如 routine 靜態檔）不掛 container。
#
# 邊界：這裡只做「連結 + 燈號 + 掛掉沒」的淺層入口。深度操作（重啟容器、
# 看 log、瀏覽檔案）一律回到 VPS Dashboard，不在此重做。

- 核心服務:
    - VPS Dashboard:
        icon: mdi-view-dashboard
        href: https://dashboard.garyhsieh-proj.com
        siteMonitor: https://dashboard.garyhsieh-proj.com
        description: 效能 / Docker / 檔案管理，深度操作面板
        server: my-docker
        container: vps-dashboard  # ← 核對
        showStats: true

    - Quick Portal:
        icon: mdi-send
        href: https://portal.garyhsieh-proj.com
        siteMonitor: https://portal.garyhsieh-proj.com
        description: 跨裝置快速傳送門
        server: my-docker
        container: quick-portal  # ← 核對
        showStats: true

    - DevHub:
        icon: mdi-code-braces
        href: https://devhub.garyhsieh-proj.com
        siteMonitor: https://devhub.garyhsieh-proj.com
        description: 開發工具集（僅限 localhost，經 Caddy 對外）
        server: my-docker
        container: devhub  # ← 核對
        showStats: true

- 工具與資料:
    - 繪本庫:
        icon: mdi-book-open-page-variant
        href: https://library.garyhsieh-proj.com
        siteMonitor: https://library.garyhsieh-proj.com
        description: 繪本收藏庫
        server: my-docker
        container: library  # ← 核對
        showStats: true

    - 定期通知:
        icon: mdi-bell-ring
        href: https://routine.garyhsieh-proj.com
        siteMonitor: https://routine.garyhsieh-proj.com
        description: routine-notify（靜態檔，Caddy basic_auth；燈號可能顯示未授權）
        # 靜態檔，無對應容器

    - ntfy:
        icon: mdi-message-badge
        href: https://notify.garyhsieh-proj.com
        siteMonitor: https://notify.garyhsieh-proj.com
        description: 推播通知，已開登入可跨裝置同步訂閱
        server: my-docker
        container: ntfy  # ← 核對
        showStats: true

    - Supabase:
        icon: mdi-database
        href: https://supabase.garyhsieh-proj.com
        siteMonitor: https://supabase.garyhsieh-proj.com
        description: self-hosted（mangan-log），API 閘道為 kong
        server: my-docker
        container: supabase-kong  # ← 核對（self-hosted 常為 supabase-kong）
        showStats: true

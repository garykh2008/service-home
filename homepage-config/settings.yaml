---
# Homepage 全域設定
# 文件：https://gethomepage.dev/configs/settings/

title: Gary's Services
description: home.garyhsieh-proj.com — 服務入口大廳

# 標題列
headerStyle: clean
theme: dark
color: slate

# 狀態燈號：滑鼠移上去才顯示，畫面清爽
statusStyle: dot

# 搜尋：不放頁首 widget（太佔寬），改用 quicklaunch——在頁面上直接打字即跳出搜尋
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false
  provider: duckduckgo

# 群組排列（順序與欄數）
layout:
  核心服務:
    style: row
    columns: 3
  工具與資料:
    style: row
    columns: 3
